name: CI

on:
  push:
    branches: [main, redesign]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # BRIEF §13: no [CONFIRM] placeholders in production. Blocks main only.
      - name: Check [CONFIRM] placeholders
        run: node scripts/check-confirm.mjs ${{ github.ref == 'refs/heads/main' && '' || '--warn' }}
