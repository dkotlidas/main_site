name: Content check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  confirm-placeholders:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: node scripts/check-content.mjs dist
